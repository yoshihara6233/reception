# 本番 DB の毎時バックアップ（RPO ≤ 1時間）
#
# ## ⚠ このファイルが「既定ブランチ」に置いてある理由（消さないこと）
#
# **GitHub は `schedule` トリガを既定ブランチ（`design/v2-redesign`）からしか起動しない。**
# 本番ブランチ `monitor-prod` にだけ置いても cron は永久に発火せず、しかも
# **エラーも出ない**（実行されないだけ）。バックアップとして最悪の壊れ方なので、
# 実行されるブランチ＝既定ブランチに置く。
#
# このワークフローは `actions/checkout` を使わない（DB へ接続して R2 へ上げるだけで
# リポジトリの中身を一切参照しない）。したがって既定ブランチから走らせて問題ない。
#
# 運用ドキュメントは `monitor-prod` の `docs/dr-runbook.md` §6 にある。
#
# ## なぜ GitHub Actions なのか
#
# Supabase の PITR（$100/mo）は Phase D 直前に入れる方針（docs/dr-runbook.md §6）。
# それまでの間、RPO 24時間（日次論理バックアップ頼み）は長すぎるので、外部から
# `pg_dump --data-only` を毎時取って埋める。
#
# 実行場所を GitHub Actions にしたのは次の理由:
#   - `pg_dump` の実バイナリが要る。Vercel(サーバレス) / Supabase Edge Functions(Deno)
#     には無く、DB 内の pg_cron からも当然実行できない。
#   - **バックアップ先とバックアップ元を別ベンダにできる**。Supabase アカウントごと
#     失う事故（誤削除・請求停止・アカウント凍結）で共倒れしないことが DR の要。
#     取得＝GitHub / 保管＝Cloudflare R2 / 本番＝Supabase の三点分離になる。
#
# ## コスト
#
# private repo の Linux ランナーは $0.008/min。1回 1分弱 × 720回/月 ≒ **$5〜6/月**。
# R2 は 14日保持で 1GB 未満＝ほぼ無料（エグレス課金なし）。PITR の $100/mo に対して
# 1/20 以下で RPO を 24h → 1h にできる、というのがこの構成の主旨。
#
# ## 必要な Secrets（Settings → Secrets and variables → Actions）
#
# | 名前 | 中身 |
# |---|---|
# | `BACKUP_DATABASE_URL` | **Session pooler** の接続URI（下の注意を必読） |
# | `BACKUP_ENC_PASSPHRASE` | ダンプ暗号化のパスフレーズ。**復元に必須なので別途保管する** |
# | `R2_ACCOUNT_ID` / `R2_ACCESS_KEY_ID` / `R2_SECRET_ACCESS_KEY` | R2 の認証情報 |
# | `R2_BACKUP_BUCKET` | **バックアップ専用バケット**。画像用 `R2_EDGE_BUCKET` とは分ける |
#
# ⚠ **接続先は Session pooler (5432) を使う**。理由:
#   - Direct connection は IPv6 のみ（IPv4 アドオン未購入）で、**GitHub ランナーは
#     IPv6 を持たない**ため必ず接続できない。
#   - Transaction pooler (6543) は prepared statement を使えず `pg_dump` が動かない。
#   → Supabase ダッシュボード → Connect → **Session pooler** の URI を使うこと。
#
# ⚠ **`R2_BACKUP_BUCKET` は公開してはいけない**。画像用バケットは
#   `img.genesis-edge.com` の Worker から公開配信している。同じバケットに置くと
#   DB ダンプ（`auth.users` のパスワードハッシュを含む）が世界に晒される。必ず別バケット。

name: DB backup

on:
  schedule:
    - cron: '17 * * * *'   # 毎時17分。毎正時は GitHub 全体が混み、遅延・スキップが起きやすい
  workflow_dispatch:        # 手動実行（訓練・移行前の臨時取得）

concurrency:
  group: db-backup
  cancel-in-progress: false   # 前回が長引いても取りこぼさない（重複より欠測の方が痛い）

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ダンプがこれ未満なら「成功したが中身が無い」とみなして落とす。
      # 静かに空ファイルを保管し続けるのがバックアップの最悪の壊れ方なので、
      # 少しでも疑わしければ失敗させて気づけるようにする。
      MIN_DUMP_BYTES: '1000000'
      RETENTION_DAYS: '14'
    steps:
      - name: PostgreSQL 17 クライアントを入れる
        # pg_dump はサーバ以上のバージョンが要る（本番は PG17: supabase/config.toml）。
        # ubuntu 標準リポジトリは古いので PGDG から入れる。
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # ランナーには PostgreSQL 16 クライアントが同梱されており、その bin が
          # PATH の前方にある。そのため postgresql-client-17 を入れても素の
          # `pg_dump` は 16 のままで、PG17 サーバに拒否される：
          #   pg_dump: error: aborting because of server version mismatch
          #   detail: server version: 17.6; pg_dump version: 16.14
          # 実際に踏んだ（run 31137713944）。絶対パスで 17 を指し、以降の
          # ステップでもそれを使う。
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          test -x "$PG_DUMP" || { echo "::error::$PG_DUMP が見つかりません"; exit 1; }

          # ここは表示するだけでなく検証する。以前は `pg_dump --version` を
          # 出力していただけで、16 と表示されていても素通りしていた。
          ver=$("$PG_DUMP" --version | awk '{print $3}')
          case "$ver" in
            17.*) echo "pg_dump ${ver} を使用します" ;;
            *) echo "::error::pg_dump が 17 系ではありません（${ver}）。PG17 のダンプは取得できません"; exit 1 ;;
          esac
          echo "PG_DUMP=$PG_DUMP" >> "$GITHUB_ENV"

      - name: ダンプを取る（データのみ）
        env:
          PGCONNECT_TIMEOUT: '30'
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::BACKUP_DATABASE_URL が未設定です"; exit 1; }

          # ── 接続文字列の形を先に検証する（2026-08-07 追加）─────────────────
          # pg_dump は引数が URI に見えないと「dbname」と解釈し、ローカルの Unix
          # ソケットへ繋ぎにいって
          #   connection to server on socket "/var/run/postgresql/.s.PGSQL.5432" failed
          # という、原因がまるで分からないエラーで落ちる。実際に踏んだ（run 31136553196）。
          # 値そのものは秘密なので出せないが、「形」だけは出せる。ここで落として
          # 直し方まで示す。
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::BACKUP_DATABASE_URL が接続 URI の形式ではありません（postgresql:// で始まっていません）。"
              # よくある混入パターンを名指しする。ここで出るのは先頭 1 文字か既知の
              # 固定文字列だけなので、パスワードは漏れない。
              case "$(printf '%s' "$DATABASE_URL" | cut -c1)" in
                ' '|'	') echo "::error::→ 先頭に空白またはタブが混入しています。貼り付け時に紛れ込んだ可能性があります。" ;;
                '"'|"'")   echo "::error::→ 引用符ごと貼り付けられています。引用符を外して URI だけを登録してください。" ;;
              esac
              case "$DATABASE_URL" in
                psql\ *) echo "::error::→ psql コマンドごと貼り付けられています。postgresql:// 以降だけを登録してください。" ;;
                *://*)   echo "::error::→ スキーム名が違います。postgresql:// で始まる必要があります。" ;;
                *@*)     echo "::error::→ スキームがありません。先頭に postgresql:// が必要です。" ;;
                *)       echo "::error::→ 接続文字列ではなく、パスワードやホスト名だけが登録されている可能性があります。" ;;
              esac
              echo "::error::期待する形: postgresql://postgres.<project-ref>:<password>@<host>.pooler.supabase.com:5432/postgres"
              echo "::error::取得元: Supabase ダッシュボード → Project Settings → Database"
              echo "::error::        → Connection string → Session pooler → URI タブ"
              exit 1
              ;;
          esac

          # パスワードを出さずに接続先だけ表示する。'##*@' は最後の '@' までを落とす
          # ので、パスワードに '@' が含まれていても漏れない。'@' が無い異常な値の
          # ときは何も出さない（全体が出てしまうため）。
          case "$DATABASE_URL" in
            *@*)
              endpoint=${DATABASE_URL##*@}
              endpoint=${endpoint%%\?*}
              echo "接続先: ${endpoint}"
              case "$endpoint" in
                *pooler.supabase.com:5432/*)
                  echo "→ Session pooler (5432)。pg_dump に対応した正しい接続方式です。" ;;
                *pooler.supabase.com:6543/*)
                  echo "::error::Transaction pooler (6543) が指定されています。この方式では pg_dump は動作しません。"
                  echo "::error::Session pooler (5432) の URI に差し替えてください。"
                  exit 1 ;;
                *.supabase.co:5432/*)
                  echo "::error::Direct connection が指定されています。Direct は IPv6 専用で、GitHub Actions の"
                  echo "::error::ランナーは IPv6 を持たないため到達できません。Session pooler (5432) に差し替えてください。"
                  exit 1 ;;
                *)
                  echo "::warning::想定外の接続先です。Supabase 以外を指している可能性があります。" ;;
              esac
              ;;
          esac
          # ──────────────────────────────────────────────────────────────────

          # スキーマは git の migration から再構築できる（RPO 0）ので data-only で足りる。
          # auth も含めるのは、失うと全利用者が再登録になるため。パスワードハッシュを
          # 含むので、この後の暗号化は必須（平文のまま保管しない）。
          "${PG_DUMP:?PG_DUMP が未設定です（クライアント導入ステップを確認）}" "$DATABASE_URL" \
            --data-only --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file=dump.sql
          ls -l dump.sql

      - name: 中身があるか確かめる
        run: |
          set -euo pipefail
          size=$(stat -c%s dump.sql)
          echo "dump size: ${size} bytes (floor ${MIN_DUMP_BYTES})"
          if [ "$size" -lt "$MIN_DUMP_BYTES" ]; then
            echo "::error::ダンプが小さすぎます (${size} < ${MIN_DUMP_BYTES})。接続先・権限を確認してください"
            exit 1
          fi
          # 主要テーブルの COPY が入っていること（権限不足だと空で成功してしまう）
          for t in stores recorders recorder_cameras edge_devices; do
            grep -q "COPY public.${t} " dump.sql || {
              echo "::error::public.${t} のデータがダンプに含まれていません"; exit 1; }
          done

      - name: 圧縮して暗号化する
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENC_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PASSPHRASE" || { echo "::error::BACKUP_ENC_PASSPHRASE が未設定です"; exit 1; }
          gzip -9 dump.sql
          gzip -t dump.sql.gz
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" --output dump.sql.gz.gpg dump.sql.gz
          # 往復確認: 復号して元と一致するか。パスフレーズや gpg の壊れに、
          # 復元が必要になった当日ではなく今日気づくため。
          gpg --batch --yes --decrypt --passphrase "$PASSPHRASE" \
              --output roundtrip.gz dump.sql.gz.gpg
          cmp dump.sql.gz roundtrip.gz
          rm -f roundtrip.gz dump.sql.gz
          ls -l dump.sql.gz.gpg

      - name: R2 へ上げる
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          ACCOUNT_ID:            ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET:                ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$BUCKET" || { echo "::error::R2_BACKUP_BUCKET が未設定です"; exit 1; }

          # ── バケット名とキーの形を検証する（2026-08-07 追加）─────────────────
          # バケット名に URL やスラッシュが混ざると
          #   Invalid bucket name "***": Bucket name must match the regex ...
          # となるが、値が伏字なので何が悪いか読み取れない。実際に踏んだ
          # （run 31140351942）。**バケット名だけ**（パスもスキームも付けない）。
          case "$BUCKET" in
            http*|s3://*)
              echo "::error::R2_BACKUP_BUCKET に URL が登録されています。バケット名だけを登録してください。"
              echo "::error::例: monitor-db-backup"
              exit 1 ;;
            */*)
              echo "::error::R2_BACKUP_BUCKET にスラッシュが含まれています。パスは付けずバケット名だけを登録してください。"
              exit 1 ;;
            *[!a-zA-Z0-9._-]*)
              echo "::error::R2_BACKUP_BUCKET に使えない文字が含まれています（英数字と . _ - のみ）。"
              exit 1 ;;
          esac

          # R2 のアクセスキーは 32 桁、シークレットは 64 桁の 16 進。取り違えると
          # 認証エラーになるが、その原因が値の取り違えだとは分からない。
          if [ ${#AWS_ACCESS_KEY_ID} -ne 32 ]; then
            echo "::error::R2_ACCESS_KEY_ID の長さが ${#AWS_ACCESS_KEY_ID} 文字です（32 文字である必要があります）。"
            echo "::error::R2 API トークン作成時に表示される Access Key ID を登録してください。"
            exit 1
          fi
          if [ ${#AWS_SECRET_ACCESS_KEY} -ne 64 ]; then
            echo "::error::R2_SECRET_ACCESS_KEY の長さが ${#AWS_SECRET_ACCESS_KEY} 文字です（64 文字である必要があります）。"
            echo "::error::Access Key ID（32文字）と取り違えていないか確認してください。"
            exit 1
          fi
          # ──────────────────────────────────────────────────────────────────

          # ── ACCOUNT_ID の形を先に検証する（2026-08-07 追加）─────────────────
          # 値をそのままホスト名に埋めるので、URL やスラッシュが混ざると
          #   aws: [ERROR]: Invalid endpoint: https://***.r2.cloudflarestorage.com
          # という、値が伏字なせいで何が悪いのか分からないエラーになる。実際に
          # 踏んだ（run 31138533383）。ここで落として直し方を示す。
          # Cloudflare のアカウント ID は 32 桁の 16 進文字列。
          test -n "$ACCOUNT_ID" || { echo "::error::R2_ACCOUNT_ID が未設定です"; exit 1; }
          if [ ${#ACCOUNT_ID} -ne 32 ]; then
            echo "::error::R2_ACCOUNT_ID の長さが ${#ACCOUNT_ID} 文字です（32 文字である必要があります）。"
            case "$ACCOUNT_ID" in
              http*) echo "::error::→ エンドポイントの URL ごと登録されています。ホスト名の先頭にある ID 部分だけを登録してください。" ;;
              */*)   echo "::error::→ スラッシュが含まれています。URL やパスではなく ID だけを登録してください。" ;;
            esac
            echo "::error::取得元: Cloudflare ダッシュボード → R2 → Overview 右側の Account ID"
            echo "::error::（S3 API の表示 https://<32桁>.r2.cloudflarestorage.com の <32桁> の部分）"
            exit 1
          fi
          case "$ACCOUNT_ID" in
            *[!0-9a-fA-F]*)
              echo "::error::R2_ACCOUNT_ID に 16 進以外の文字が含まれています。"
              echo "::error::取得元: Cloudflare ダッシュボード → R2 → Overview 右側の Account ID"
              exit 1 ;;
          esac
          # ──────────────────────────────────────────────────────────────────

          endpoint="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          # UTC の時刻でキーを作る（復元時に JST/UTC を取り違えないよう Z を明示）。
          key="db/$(date -u +%Y/%m/%d)/monitor-$(date -u +%Y%m%dT%H%M%SZ).sql.gz.gpg"
          aws s3 cp dump.sql.gz.gpg "s3://${BUCKET}/${key}" \
            --endpoint-url "$endpoint" --only-show-errors
          # 置けたことを一覧で確認する（cp の成功だけを信じない）
          aws s3 ls "s3://${BUCKET}/${key}" --endpoint-url "$endpoint"
          echo "backed up: ${key}" >> "$GITHUB_STEP_SUMMARY"

      - name: 古い世代を消す
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          ACCOUNT_ID:            ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET:                ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          endpoint="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          cutoff=$(date -u -d "-${RETENTION_DAYS} days" +%s)
          # 一覧はファイルに落としてから回す（パイプの subshell を挟まないため）。
          # 空バケットのとき aws は "None" を返すので弾く。
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "db/" \
            --endpoint-url "$endpoint" --query 'Contents[].[Key,LastModified]' --output text \
            > listing.txt || true
          deleted=0
          while read -r key modified; do
            case "$key" in ''|None) continue ;; esac
            [ -n "$modified" ] || continue
            if [ "$(date -u -d "$modified" +%s)" -lt "$cutoff" ]; then
              aws s3 rm "s3://${BUCKET}/${key}" --endpoint-url "$endpoint" --only-show-errors
              deleted=$((deleted + 1))
            fi
          done < listing.txt
          kept=$(grep -cv '^\(None\)\?$' listing.txt || true)
          echo "retention: ${RETENTION_DAYS} 日 / 削除 ${deleted} 件 / 保管 $((kept - deleted)) 件" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 失敗をメールで知らせる
        # バックアップの失敗は「静かに壊れ続ける」のが一番怖い。GitHub の通知だけに
        # 頼らず、運用アドレスへ能動的に出す（死活アラートと同じ Resend 経路）。
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAILS:   ${{ secrets.ALERT_EMAILS }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ALERT_EMAILS:-}" ]; then
            echo "通知用の secret が無いので送信をスキップします（GitHub の通知のみ）"
            exit 0
          fi
          to=$(echo "$ALERT_EMAILS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' \
               | grep -v '^$' | awk '{printf "%s\"%s\"", (NR>1?",":""), $0}')
          curl -fsS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Recording Monitor <admin@genesis-edge.com>\",
                 \"to\":[${to}],
                 \"subject\":\"[緊急] DB バックアップが失敗しました\",
                 \"text\":\"毎時の DB バックアップが失敗しました。RPO が 24 時間（Supabase 日次）に戻っています。\\n\\n実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\n\\n復旧手順: docs/dr-runbook.md §6\"}" \
            > /dev/null
