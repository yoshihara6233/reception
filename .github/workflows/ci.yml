# F46.5: モノレポ CI (Bun workspaces 対応)
#
# - 各 app (monitor / edge-agent / shared) を並列に typecheck / test / build / lint
# - paths フィルタで「変更があった app だけ」走らせる構成
# - bun install を 1 回だけ実行 (workspace で全 app の deps が一括で揃う)
#
# Phase 0 で本ファイルを追加。Phase A で全 app に lint / build を拡張。
# E2E は 2026-08-09 に追加（e2e job・6 ロールの画面境界）。

name: CI

on:
  push:
    branches: [main, develop, monitor-prod]
  pull_request:
    branches: [main, develop, monitor-prod]

# 同じ branch の古い run はキャンセル (PR への連打対応)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 変更検知 (どの app を走らせるか決める) ──────────────────────────────
  #
  # ⚠ **push では変更検知を使わず、必ず全 job を走らせる**（2026-08-06 是正）。
  #
  # 以前は push でも paths-filter を使っていたが、`actions/checkout` は既定で
  # 浅いクローン(fetch-depth:1)のため、push イベントの比較対象 `github.event.before`
  # がローカルに存在せず **毎回 git exit 128 で落ちていた**。detect-changes が落ちると
  # 後続 job は全て skip され、しかも当時の ci-passed は skip を成功として扱っていたので、
  # **monitor-prod への push 後の CI は何も検証しないまま緑を返していた**
  # （実例: run 31071066635 / 31056989148）。
  #
  # fetch-depth:0 で直すこともできるが、そもそも **マージ後の CI は安全網**であって、
  # そこで job を間引くのは目的に反する。push は全部走らせるのが正しい。
  # 差分による間引きは、速いフィードバックが要る pull_request だけで行う。
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # push のときは無条件に true（＝全 job 実行）。PR のときだけ paths-filter の結果を使う。
      shared:     ${{ github.event_name == 'push' || steps.changes.outputs.shared     == 'true' }}
      monitor:    ${{ github.event_name == 'push' || steps.changes.outputs.monitor    == 'true' }}
      edge-agent: ${{ github.event_name == 'push' || steps.changes.outputs.edge-agent == 'true' }}
      docs:       ${{ github.event_name == 'push' || steps.changes.outputs.docs       == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3.0.2 (SHA-pinned: supply-chain)
        id: changes
        if: github.event_name == 'pull_request'   # push では走らせない（上のコメント参照）
        with:
          # CI 自身を変えた PR では全 job を走らせる（CI の変更は CI で確かめる）。
          # これが無いと、ワークフローを壊す PR が「変更なし＝全 skip」で緑になる。
          filters: |
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            monitor:
              - 'claude/monitor/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            edge-agent:
              - 'claude/edge-agent/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'

  # ── shared パッケージの typecheck ────────────────────────────────────────
  shared:
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: Typecheck shared
        working-directory: packages/shared
        run: bunx tsc --noEmit

  # ── monitor (Next.js) ───────────────────────────────────────────────────
  monitor:
    needs: detect-changes
    if: needs.detect-changes.outputs.monitor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: Typecheck monitor
        working-directory: claude/monitor
        run: ./node_modules/.bin/tsc --noEmit
      - name: Unit tests (vitest)
        working-directory: claude/monitor
        run: ./node_modules/.bin/vitest run
      - name: Build monitor (next build)
        working-directory: claude/monitor
        run: bun run build
        env:
          # build-only placeholders; real values live in Vercel project settings.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
      - name: Lint monitor
        working-directory: claude/monitor
        run: bun run lint  # lint gate: eslint.config.mjs (Next16 flat) 確立済み・errorで失敗

  # ── edge-agent (Bun) ────────────────────────────────────────────────────
  edge-agent:
    needs: detect-changes
    if: needs.detect-changes.outputs.edge-agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: Typecheck edge-agent
        working-directory: claude/edge-agent
        run: bunx tsc --noEmit
      - name: Unit tests (vitest)
        working-directory: claude/edge-agent
        run: bunx vitest run
      - name: Build edge-agent (tsc)
        working-directory: claude/edge-agent
        run: bun run build
      - name: Lint edge-agent
        working-directory: claude/edge-agent
        run: bun run lint  # lint gate: eslint.config.mjs (typescript-eslint flat)・errorで失敗

  # ── authz 契約テスト (Phase A/G1: RLS テナント×ロール越権防止・不可侵) ──────
  authz:
    needs: detect-changes
    if: needs.detect-changes.outputs.monitor == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: authz contract tests (Postgres RLS, tenant×role)
        working-directory: claude/monitor
        run: ./node_modules/.bin/vitest run --config vitest.authz.config.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # ── ローカル Supabase を要する検査 (RLS メタ + ブラウザ E2E) ──────────────
  #
  # 本番と同じ migration を当てた DB が要る 2 つをまとめて 1 job にする
  # （supabase start の起動コストを二重に払わないため）。
  #
  # ① RLS メタ検査 … カタログを直接見る。RLS の有効化漏れ・無条件ポリシー・
  #                   ビューの security_invoker・SECURITY DEFINER の search_path。
  #                   authz job は**手書きの近似スキーマ**に対して走るので、
  #                   本物のスキーマのこの手の抜けは見えない。
  # ② ブラウザ E2E … 画面を見る。メニューの出し分け・直 URL への到達・
  #                   middleware のリダイレクトは動かさないと分からない。
  #
  # ローカル Supabase を立てて migration を当て、supabase/seed.example.sql の
  # 6 ロールでログインする（seed.sql は各自の実験用で gitignore 済みなので使わない）。
  e2e:
    needs: detect-changes
    if: needs.detect-changes.outputs.monitor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: claude/monitor
        run: ./node_modules/.bin/playwright install --with-deps chromium
      # 画面に要らないコンテナは起動しない（起動時間の大半がイメージ取得）。
      # 必要なのは db / kong / rest と、除外リストに無い auth(gotrue)。
      - name: Start local Supabase
        working-directory: claude/monitor
        run: supabase start -x realtime,storage,imgproxy,inbucket,studio,vector,edge-runtime,functions,analytics,meta
      - name: Apply migrations
        working-directory: claude/monitor
        run: supabase db reset --no-seed   # seed は globalSetup が seed.example.sql を当てる
      # migration を当てた直後のカタログを見る。authz job（手書き近似スキーマ）
      # では見られない「本物のスキーマ」の検査＝RLS の有効化漏れ・無条件ポリシー・
      # ビューの security_invoker・SECURITY DEFINER の search_path。
      # ブラウザより先に走らせて、落ちたときの原因を切り分けやすくする。
      - name: RLS メタ検査
        working-directory: claude/monitor
        run: ./node_modules/.bin/vitest run --config vitest.rls-meta.config.ts
      - name: E2E (Playwright, 6 ロール)
        working-directory: claude/monitor
        run: ./node_modules/.bin/playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: claude/monitor/playwright-report/
          retention-days: 7

  # ── 全 job 完了確認 (PR マージ要件用) ──────────────────────────────────
  ci-passed:
    needs: [detect-changes, shared, monitor, edge-agent, authz, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # ★ detect-changes 自体の失敗を必ず落とす（2026-08-06 是正）。
      # これが落ちると後続は全て skip される。skip を「変更が無かった」と解釈すると、
      # **検知が壊れているだけなのに CI 全体が緑になる**。実際にそうなっていた。
      # 「走らなかった」と「走って通った」を混同しないための最重要ガード。
      - name: Check change detection
        run: |
          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
            echo "::error::detect-changes が ${{ needs.detect-changes.result }} で終了しました。"
            echo "::error::後続 job は skip されており、何も検証されていません。"
            exit 1
          fi
      - name: Check all jobs
        run: |
          # paths-filter で skip された job は 'skipped' 扱いになるので
          # 'failure' / 'cancelled' のみを失敗とみなす
          # （skip が正当なのは PR のときだけ。push では上の detect-changes が
          #   全 true を返すため、そもそも skip は発生しない）
          if [[ "${{ needs.shared.result }}" == "failure" ]] || \
             [[ "${{ needs.monitor.result }}" == "failure" ]] || \
             [[ "${{ needs.edge-agent.result }}" == "failure" ]] || \
             [[ "${{ needs.authz.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          if [[ "${{ needs.shared.result }}" == "cancelled" ]] || \
             [[ "${{ needs.monitor.result }}" == "cancelled" ]] || \
             [[ "${{ needs.edge-agent.result }}" == "cancelled" ]] || \
             [[ "${{ needs.authz.result }}" == "cancelled" ]] || \
             [[ "${{ needs.e2e.result }}" == "cancelled" ]]; then
            echo "::warning::One or more CI jobs were cancelled"
            exit 1
          fi
          # push（マージ後の安全網）では skip があってはならない。
          # ここが緑のまま skip されるのが今回の不具合そのものだったので、明示的に落とす。
          if [[ "${{ github.event_name }}" == "push" ]]; then
            for r in "${{ needs.shared.result }}" "${{ needs.monitor.result }}" \
                     "${{ needs.edge-agent.result }}" "${{ needs.authz.result }}" \
                     "${{ needs.e2e.result }}"; do
              if [[ "$r" == "skipped" ]]; then
                echo "::error::push では全 job が走るはずですが skip されたものがあります"
                echo "::error::shared=${{ needs.shared.result }} monitor=${{ needs.monitor.result }} edge-agent=${{ needs.edge-agent.result }} authz=${{ needs.authz.result }} e2e=${{ needs.e2e.result }}"
                exit 1
              fi
            done
          fi
          echo "✓ All required jobs passed (or skipped due to no changes on a PR)"
