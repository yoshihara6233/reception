# F46.5: モノレポ CI (Bun workspaces 対応)
#
# - 各 app (monitor / edge-agent / shared) を並列に typecheck / test / build / lint
# - paths フィルタで「変更があった app だけ」走らせる構成
# - bun install を 1 回だけ実行 (workspace で全 app の deps が一括で揃う)
#
# Phase 0 で本ファイルを追加。Phase A で全 app に lint / build を拡張。E2E は今後。

name: CI

on:
  push:
    branches: [main, develop, monitor-prod]
  pull_request:
    branches: [main, develop, monitor-prod]

# 同じ branch の古い run はキャンセル (PR への連打対応)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 変更検知 (どの app を走らせるか決める) ──────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      shared:     ${{ steps.changes.outputs.shared }}
      monitor:    ${{ steps.changes.outputs.monitor }}
      edge-agent: ${{ steps.changes.outputs.edge-agent }}
      docs:       ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3.0.2 (SHA-pinned: supply-chain)
        id: changes
        with:
          filters: |
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'bun.lock'
            monitor:
              - 'claude/monitor/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'bun.lock'
            edge-agent:
              - 'claude/edge-agent/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'bun.lock'
            docs:
              - 'docs/**'
              - '**/*.md'

  # ── shared パッケージの typecheck ────────────────────────────────────────
  shared:
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: Typecheck shared
        working-directory: packages/shared
        run: bunx tsc --noEmit

  # ── monitor (Next.js) ───────────────────────────────────────────────────
  monitor:
    needs: detect-changes
    if: needs.detect-changes.outputs.monitor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: Typecheck monitor
        working-directory: claude/monitor
        run: ./node_modules/.bin/tsc --noEmit
      - name: Unit tests (vitest)
        working-directory: claude/monitor
        run: ./node_modules/.bin/vitest run
      - name: Build monitor (next build)
        working-directory: claude/monitor
        run: bun run build
        env:
          # build-only placeholders; real values live in Vercel project settings.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
      - name: Lint monitor
        working-directory: claude/monitor
        run: bun run lint  # lint gate: eslint.config.mjs (Next16 flat) 確立済み・errorで失敗

  # ── edge-agent (Bun) ────────────────────────────────────────────────────
  edge-agent:
    needs: detect-changes
    if: needs.detect-changes.outputs.edge-agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: Typecheck edge-agent
        working-directory: claude/edge-agent
        run: bunx tsc --noEmit
      - name: Unit tests (vitest)
        working-directory: claude/edge-agent
        run: bunx vitest run
      - name: Build edge-agent (tsc)
        working-directory: claude/edge-agent
        run: bun run build
      - name: Lint edge-agent
        working-directory: claude/edge-agent
        run: bun run lint  # lint gate: eslint.config.mjs (typescript-eslint flat)・errorで失敗

  # ── authz 契約テスト (Phase A/G1: RLS テナント×ロール越権防止・不可侵) ──────
  authz:
    needs: detect-changes
    if: needs.detect-changes.outputs.monitor == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies (workspace)
        run: bun install --frozen-lockfile
      - name: authz contract tests (Postgres RLS, tenant×role)
        working-directory: claude/monitor
        run: ./node_modules/.bin/vitest run --config vitest.authz.config.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # ── 全 job 完了確認 (PR マージ要件用) ──────────────────────────────────
  ci-passed:
    needs: [shared, monitor, edge-agent, authz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          # paths-filter で skip された job は 'skipped' 扱いになるので
          # 'failure' / 'cancelled' のみを失敗とみなす
          if [[ "${{ needs.shared.result }}" == "failure" ]] || \
             [[ "${{ needs.monitor.result }}" == "failure" ]] || \
             [[ "${{ needs.edge-agent.result }}" == "failure" ]] || \
             [[ "${{ needs.authz.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          if [[ "${{ needs.shared.result }}" == "cancelled" ]] || \
             [[ "${{ needs.monitor.result }}" == "cancelled" ]] || \
             [[ "${{ needs.edge-agent.result }}" == "cancelled" ]] || \
             [[ "${{ needs.authz.result }}" == "cancelled" ]]; then
            echo "::warning::One or more CI jobs were cancelled"
            exit 1
          fi
          echo "✓ All required jobs passed (or skipped due to no changes)"
